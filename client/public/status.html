<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vincent - System Status Check</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .status-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            background: #f5f5f5;
            transition: all 0.3s;
        }
        .status-item:hover {
            transform: translateX(5px);
        }
        .status-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .status-icon.loading { background: #ffd700; }
        .status-icon.success { background: #4caf50; color: white; }
        .status-icon.error { background: #f44336; color: white; }
        .status-text {
            flex: 1;
        }
        .status-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 3px;
        }
        .status-message {
            font-size: 13px;
            color: #666;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-top: 20px;
            width: 100%;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.02);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ Vincent Restaurant</h1>
        <p class="subtitle">System Status Check</p>
        
        <div id="backend-status" class="status-item">
            <div class="status-icon loading spinner">⏳</div>
            <div class="status-text">
                <div class="status-label">Backend API</div>
                <div class="status-message">Checking connection...</div>
            </div>
        </div>
        
        <div id="database-status" class="status-item">
            <div class="status-icon loading spinner">⏳</div>
            <div class="status-text">
                <div class="status-label">Database</div>
                <div class="status-message">Checking data...</div>
            </div>
        </div>
        
        <div id="frontend-status" class="status-item">
            <div class="status-icon success">✓</div>
            <div class="status-text">
                <div class="status-label">Frontend</div>
                <div class="status-message">Running on http://localhost:5173</div>
            </div>
        </div>
        
        <button class="btn" onclick="checkAgain()">🔄 Check Again</button>
        <button class="btn" onclick="goToApp()" id="launchBtn" disabled>🚀 Launch Application</button>
    </div>

    <script>
        let backendOk = false;
        let databaseOk = false;

        async function checkBackend() {
            const statusDiv = document.getElementById('backend-status');
            const icon = statusDiv.querySelector('.status-icon');
            const message = statusDiv.querySelector('.status-message');
            
            try {
                const response = await fetch('http://localhost:3000/api/health');
                const data = await response.json();
                
                if (data.success) {
                    icon.className = 'status-icon success';
                    icon.textContent = '✓';
                    message.textContent = 'Connected to http://localhost:3000';
                    backendOk = true;
                    checkDatabase();
                } else {
                    throw new Error('Invalid response');
                }
            } catch (error) {
                icon.className = 'status-icon error';
                icon.textContent = '✗';
                message.innerHTML = '❌ Not running<br><small style="color:#f44336;">Start backend: cd server && npm run dev</small>';
                backendOk = false;
                
                const dbStatus = document.getElementById('database-status');
                const dbIcon = dbStatus.querySelector('.status-icon');
                const dbMessage = dbStatus.querySelector('.status-message');
                dbIcon.className = 'status-icon error';
                dbIcon.textContent = '✗';
                dbMessage.textContent = 'Cannot check (backend not running)';
            }
            
            updateLaunchButton();
        }

        async function checkDatabase() {
            const statusDiv = document.getElementById('database-status');
            const icon = statusDiv.querySelector('.status-icon');
            const message = statusDiv.querySelector('.status-message');
            
            try {
                const response = await fetch('http://localhost:3000/api/menu/categories');
                const data = await response.json();
                
                if (data.success && data.data.categories) {
                    const count = data.data.categories.length;
                    icon.className = 'status-icon success';
                    icon.textContent = '✓';
                    message.textContent = `MongoDB connected - ${count} categories loaded`;
                    databaseOk = true;
                } else {
                    throw new Error('No data');
                }
            } catch (error) {
                icon.className = 'status-icon error';
                icon.textContent = '✗';
                message.innerHTML = '❌ No data found<br><small style="color:#f44336;">Run: cd server && npm run seed</small>';
                databaseOk = false;
            }
            
            updateLaunchButton();
        }

        function updateLaunchButton() {
            const btn = document.getElementById('launchBtn');
            if (backendOk && databaseOk) {
                btn.disabled = false;
                btn.textContent = '🚀 Launch Application';
            } else {
                btn.disabled = true;
                btn.textContent = '⚠️ Fix Issues First';
            }
        }

        function checkAgain() {
            backendOk = false;
            databaseOk = false;
            
            const statuses = document.querySelectorAll('.status-item');
            statuses.forEach((status, index) => {
                if (index < 2) {
                    const icon = status.querySelector('.status-icon');
                    const message = status.querySelector('.status-message');
                    icon.className = 'status-icon loading spinner';
                    icon.textContent = '⏳';
                    message.textContent = 'Checking...';
                }
            });
            
            checkBackend();
        }

        function goToApp() {
            if (backendOk && databaseOk) {
                window.location.href = '/';
            }
        }

        // Auto-check on load
        setTimeout(checkBackend, 500);
    </script>
</body>
</html>
